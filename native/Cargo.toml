[package]
name = "looker"
version = "1.1.0"
edition = "2024"
description = "Looker, a fast photo viewer for Windows (native rebuild)"

[dependencies]
hayro-jpeg2000 = "0.4.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "webp", "tga", "pnm", "qoi", "ico", "dds"] }
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }
kamadak-exif = "0.6.1"
windows-core = "0.62"
windows-numerics = "0.3"
xcf = "0.4.0"

[dependencies.windows]
version = "0.62.2"
features = [
    "ApplicationModel",
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decoding and drawing run on every keypress; keep dependencies optimised even in dev builds.
[profile.dev.package."*"]
opt-level = 3
